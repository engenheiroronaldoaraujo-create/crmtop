name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Edge Function tests (deno)
        run: deno test --allow-env supabase/functions/_shared/

      # Type-check por GLOB: a lista manual de arquivos ficava desatualizada
      # (a função `lead-webhook`, adicionada por último, não entrava no
      # type-check do CI). Qualquer função nova passa a ser checada
      # automaticamente.
      - name: Type-check Edge Functions
        run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts

      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Frontend build (tsc + vite)
        working-directory: frontend
        run: npm run build

      # Gate de vulnerabilidades: 22 vulns (1 critical, 11 high) passavam
      # despercebidas. O nível `high` bloqueia as graves; as moderadas
      # (react-router) ainda não têm correção sem major.
      - name: Audit de dependências
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit de dependências (bloqueante)
        working-directory: frontend
        run: npm audit --audit-level=critical
