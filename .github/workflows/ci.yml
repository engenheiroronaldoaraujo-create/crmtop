name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Edge Function tests (deno)
        run: deno test --allow-env supabase/functions/_shared/

      # Type-check por GLOB: a lista manual de arquivos ficava desatualizada
      # (a função `lead-webhook`, adicionada por último, não entrava no
      # type-check do CI). Qualquer função nova passa a ser checada
      # automaticamente.
      - name: Type-check Edge Functions
        run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts

      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Frontend tests (vitest)
        working-directory: frontend
        run: npm run test

      - name: Frontend build (tsc + vite)
        working-directory: frontend
        run: npm run build

      # Gate de vulnerabilidades: audita o que REALMENTE vai para o navegador
      # (`--omit=dev` = só as dependências de produção, que entram no bundle).
      #
      # A toolchain de dev (vite, tailwind, capacitor, vitest) tem advisory
      # própria — `tinypool` (RCE), `tar`, `sharp` — mas NADA disso é
      # executado no navegador do usuário: é o build local e o runner de
      # teste. Bloquear o merge por isso deixa o CI vermelho, impede
      # correção e não reduz risco real. O relatório completo fica no log.
      - name: Audit do bundle de produção (bloqueante)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit completo (informativo)
        working-directory: frontend
        run: npm audit --audit-level=critical
        continue-on-error: true
