name: Release APK Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versão do APK (ex: 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build web
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_B64" || (echo "Falta o secret ANDROID_KEYSTORE_B64" && exit 1)
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > frontend/android/keystore-release.jks

      - name: Build APK release
        working-directory: frontend/android
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: ${{ inputs.version_name }}
          APK_KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/keystore-release.jks
          APK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK ao Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          APK=frontend/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || (echo "APK não gerado" && exit 1)
          SIZE=$(stat -c%s "$APK")
          curl -fsS -X POST "$SUPABASE_URL/storage/v1/object/apk-releases/latest/atendatop-crm.apk" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: upsert" \
            --data-binary "@$APK"
          printf '{"version":"%s","code":%s,"built_at":"%s","size_bytes":%s}' \
            "$VERSION_NAME" "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIZE" \
            > manifest.json
          curl -fsS -X PUT "$SUPABASE_URL/storage/v1/object/apk-releases/latest/manifest.json" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @manifest.json
          echo "Publicado: versão $VERSION_NAME ($SIZE bytes)"

      - name: Artifact do APK
        uses: actions/upload-artifact@v4
        with:
          name: atendatop-crm-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk

      - name: Remove keystore do runner
        if: always()
        run: rm -f frontend/android/keystore-release.jks
